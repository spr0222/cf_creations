name: Deploy Elastic Beanstalk Node.js Stack

'on':
  push:
    branches:
      - main
    paths:
      - infra/beanstalk-nodejs-stack.yaml
      - .github/workflows/deploy-beanstalk-nodejs-stack.yml
  workflow_dispatch:

concurrency:
  group: deploy-beanstalk-nodejs-stack
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::The DB_PASSWORD repository secret is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          PASSWORD_LENGTH=$(printf '%s' "$DB_PASSWORD" | wc -c)
          if [ "$PASSWORD_LENGTH" -lt 8 ]; then
            echo "::error::DB_PASSWORD must be at least 8 characters long." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infra/beanstalk-nodejs-stack.yaml

      - name: Resolve current Node.js solution stack
        id: solution-stack
        run: |
          STACK=$(aws elasticbeanstalk list-available-solution-stacks \
            --query "SolutionStacks[?contains(@, 'running Node.js')] | [0]" \
            --output text)
          if [ -z "$STACK" ] || [ "$STACK" = "None" ]; then
            echo "No Node.js solution stack found" >&2
            exit 1
          fi
          echo "Using solution stack: $STACK"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"

      - name: Deploy Elastic Beanstalk Node.js stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          aws cloudformation deploy \
            --template-file infra/beanstalk-nodejs-stack.yaml \
            --stack-name spr0222-beanstalk-nodejs-stack \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              SolutionStackName="${{ steps.solution-stack.outputs.stack }}" \
              DBPassword="$DB_PASSWORD" \
            --no-fail-on-empty-changeset

      - name: Show CloudFormation failure events
        if: ${{ failure() }}
        run: |
          aws cloudformation describe-stack-events \
            --stack-name spr0222-beanstalk-nodejs-stack \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`DELETE_FAILED`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table || true
