name: Deploy to AWS Elastic Beanstalk

'on':
  push:
    branches:
      - main
    paths:
      - infra/beanstalk-template.yaml
      - .github/workflows/deploy-beanstalk.yml
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  STACK_NAME: my-eb-stack
  APP_NAME: my-eb-app
  ENV_NAME: my-eb-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy/Update CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/beanstalk-template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              AppName=${{ env.APP_NAME }} \
              EnvName=${{ env.ENV_NAME }} \
            --no-fail-on-empty-changeset

      - name: Get application version S3 bucket name from stack outputs
        id: get-bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='AppVersionBucketName'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Package application
        run: |
          zip -r app-${{ github.sha }}.zip . \
            -x ".git/*" ".github/*" "infra/*" "node_modules/*"

      - name: Upload package to S3
        run: |
          aws s3 cp app-${{ github.sha }}.zip \
            s3://${{ steps.get-bucket.outputs.bucket }}/app-${{ github.sha }}.zip

      - name: Create new Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ env.APP_NAME }} \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket="${{ steps.get-bucket.outputs.bucket }}",S3Key="app-${{ github.sha }}.zip" \
            --auto-create-application

      - name: Deploy new version to the environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ env.ENV_NAME }} \
            --version-label ${{ github.sha }}

      - name: Wait for environment to become healthy
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ env.APP_NAME }} \
            --environment-names ${{ env.ENV_NAME }}

      - name: Print environment URL
        run: |
          aws elasticbeanstalk describe-environments \
            --environment-names ${{ env.ENV_NAME }} \
            --query "Environments[0].CNAME" \
            --output text

      - name: Show CloudFormation failure events
        if: ${{ failure() }}
        run: |
          aws cloudformation describe-stack-events \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`DELETE_FAILED`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table || true
